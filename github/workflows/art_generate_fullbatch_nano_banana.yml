name: Art - Generate Full Batch (nano-banana-pro)

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch id for manifests/previews"
        required: true
        default: "20260116-fullbatch-nanobanana"
      limit:
        description: "Limit number of assets (0=all)"
        required: true
        default: "0"
      sleep_seconds:
        description: "Optional sleep between generations (rate limit safety)"
        required: true
        default: "0"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-art.txt

      - name: Generate assets via FAL
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python scripts/fal_generate_assets.py --batch "${{ inputs.batch_id }}" --limit "${{ inputs.limit }}" --sleep "${{ inputs.sleep_seconds }}"

      - name: Make contact sheet
        run: |
          python scripts/make_contact_sheet.py --batch "${{ inputs.batch_id }}"

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "art: generate assets (${{ inputs.batch_id }})" || echo "Nothing to commit"
          git push
